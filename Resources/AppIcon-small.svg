<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="140" x2="880" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B3340"/>
      <stop offset="0.52" stop-color="#1A2230"/>
      <stop offset="1" stop-color="#0E141E"/>
    </linearGradient>
    <linearGradient id="frontCard" x1="470" y1="330" x2="470" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4456"/>
      <stop offset="1" stop-color="#1F2733"/>
    </linearGradient>
    <linearGradient id="clip" x1="470" y1="296" x2="470" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F0EA"/>
      <stop offset="1" stop-color="#BDB6AA"/>
    </linearGradient>
    <linearGradient id="wisp" x1="320" y1="560" x2="640" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="0.5" stop-color="#FFF0CC"/>
      <stop offset="1" stop-color="#FF9E5C"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!-- Back card (history) -->
    <rect x="430" y="300" width="318" height="420" rx="54" fill="#2A323F"/>
    <rect x="430" y="300" width="318" height="420" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

    <!-- Front card (current clip) -->
    <rect x="292" y="338" width="372" height="468" rx="62" fill="url(#frontCard)"/>
    <rect x="292" y="338" width="372" height="468" rx="62" fill="none" stroke="#FFC57A" stroke-opacity="0.85" stroke-width="6"/>

    <!-- Clip -->
    <path d="M422 352 a56 56 0 0 1 112 0 v6 a30 30 0 0 1 -30 30 h-52 a30 30 0 0 1 -30 -30 z" fill="url(#clip)"/>
    <rect x="458" y="348" width="40" height="22" rx="11" fill="#1F2733"/>

    <!-- Bold luminous content lines -->
    <rect x="346" y="540" width="248" height="30" rx="15" fill="url(#wisp)"/>
    <rect x="346" y="602" width="180" height="30" rx="15" fill="url(#wisp)" opacity="0.8"/>
  </g>
</svg>
