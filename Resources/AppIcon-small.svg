<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified high-contrast variant for tiny sizes (16/32px, e.g. Finder
       list view). The clipboard is a solid amber shape so the silhouette reads
       against any row colour; the detailed dark icon is used at 128px+. -->
  <defs>
    <linearGradient id="bg" x1="160" y1="140" x2="880" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B3340"/>
      <stop offset="0.52" stop-color="#1A2230"/>
      <stop offset="1" stop-color="#0E141E"/>
    </linearGradient>
    <linearGradient id="card" x1="470" y1="330" x2="470" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF9E3C"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!-- Back card (history stack hint) -->
    <rect x="430" y="312" width="300" height="404" rx="56" fill="#C98A3E"/>

    <!-- Front card (current clip), solid amber for contrast -->
    <rect x="276" y="346" width="420" height="464" rx="70" fill="url(#card)"/>

    <!-- Clip -->
    <path d="M412 358 a74 74 0 0 1 148 0 v8 a34 34 0 0 1 -34 34 h-80 a34 34 0 0 1 -34 -34 z" fill="#E6F0F4"/>
    <rect x="460" y="356" width="52" height="26" rx="13" fill="#1F2733"/>

    <!-- Content lines (dark slate for high contrast on amber) -->
    <rect x="350" y="560" width="280" height="40" rx="20" fill="#23303F"/>
    <rect x="350" y="632" width="200" height="40" rx="20" fill="#23303F"/>
  </g>
</svg>
