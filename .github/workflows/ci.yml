name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Assemble app bundle (ad-hoc signed)
        run: Scripts/build-app.sh release

      - name: Verify signature
        run: codesign --verify --verbose=2 dist/Wisp.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wisp-app
          path: dist/Wisp.app
          if-no-files-found: error
